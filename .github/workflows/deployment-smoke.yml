name: Deployment smoke check

# After a successful production deployment (Vercel reports it to GitHub), or when started by hand with a URL, this makes
# plain GET requests to two public pages and checks they answer. It never sends a POST, never searches for jobs and never
# starts a recruiter lookup, so it spends no job-board quota and no Anthropic credit. It reads no secrets.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Site address to check, for example https://career-match-hub.vercel.app"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.event.deployment_status.id || github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    name: Public health check
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the home page and the public status route
        env:
          # Passed as environment variables, never spliced into the script text.
          INPUT_URL: ${{ inputs.url }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          set -euo pipefail
          site="${INPUT_URL:-$DEPLOYMENT_URL}"
          site="${site%/}"
          if ! printf '%s' "$site" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?$'; then
            echo "::error::The address to check must be a plain https address with no path."
            exit 1
          fi
          echo "Checking $site"

          # A new deployment can take a moment to answer, so each request is tried a few times.
          get() {
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o "$2" -w '%{http_code}' --max-time 20 "$site$1" || echo 000)
              if [ "$code" = "200" ]; then return 0; fi
              echo "GET $1 answered $code (attempt $attempt of 5)"
              sleep 10
            done
            return 1
          }

          get "/" home.html || { echo "::error::The home page did not answer 200."; exit 1; }
          grep -q "Career Match Hub" home.html || { echo "::error::The home page did not contain the app."; exit 1; }
          echo "Home page: ok"

          get "/api/status" status.json || { echo "::error::/api/status did not answer 200."; exit 1; }
          jq -e '(.ai | type == "boolean") and (.jobProvider | type == "string") and (.recruiterWebSearch | type == "boolean")' status.json > /dev/null \
            || { echo "::error::/api/status did not have the expected shape."; exit 1; }
          # Only these three facts are printed, never the whole body.
          jq -r '"Status route: ok (ai=\(.ai), jobProvider=\(.jobProvider), recruiterWebSearch=\(.recruiterWebSearch))"' status.json
