name: CI

# Runs on every pull request and every push to main. It needs no secrets and sets no API keys: the app is tested in its
# free, no-key configuration, and the browser tests block every request that leaves the runner.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Unit tests, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 with the npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Unit tests (npm test)
        run: npm test

      - name: Lint (npm run lint)
        run: npm run lint

      - name: Type check (npm run typecheck)
        run: npm run typecheck

      - name: Production build (npm run build)
        run: npm run build

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 with the npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the Chromium browser
        run: npm run test:e2e:install

      - name: Production build for the smoke tests (no API keys)
        run: npm run build

      - name: Browser smoke tests (npm run test:e2e)
        run: npm run test:e2e

      # Only when a test failed. The report and traces contain only the invented data the tests use, never real
      # resumes or recruiter details, because the tests never see any.
      - name: Upload the Playwright report (failed runs only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
